<html lang="ja">

<meta name="theme-color" content="#f7f4ee">
<title>小3 漢字れんしゅう</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;min-height:100%;background:#f7f4ee;color:#292929;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
body{padding-bottom:30px}
main{max-width:1100px;margin:auto;padding:14px}
h1{text-align:center;font-size:25px;margin:8px 0 16px}
.card{background:#fff;border-radius:22px;padding:16px;margin:12px 0;box-shadow:0 2px 12px rgba(0,0,0,.04)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{border:0;border-radius:15px;background:#eeeae3;padding:12px 4px;font-size:15px;color:#292929}
.day.active{background:#5e7a66;color:#fff}
.day small{display:block;margin-top:3px}

.example{text-align:center;color:#666;font-size:14px;margin-bottom:10px}
.practice{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.panel{border:2px solid #ddd9d2;border-radius:18px;padding:10px}
.panel h2{font-size:18px;margin:0 0 8px}
.canvasWrap{position:relative;width:100%;aspect-ratio:1.15;background:#fff;border:2px solid #d8d5cf;border-radius:16px;overflow:hidden;touch-action:none}
.traceChar{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:min(42vw,150px);color:#e7e3db;pointer-events:none;user-select:none}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-user-drag:none;outline:none;cursor:crosshair}
.actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
button{font-size:16px;padding:11px 18px;border:0;border-radius:14px;background:#5e7a66;color:#fff}
button.secondary{background:#ebe8e1;color:#292929}
button:active{transform:scale(.98)}
.testTitle{text-align:center;font-size:22px;margin:5px 0 8px}
.testGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}
.testItem{border:2px solid #ddd9d2;border-radius:15px;padding:10px 5px;text-align:center;min-height:145px;display:flex;flex-direction:column;justify-content:space-between}
.q{font-size:15px}
.answer{font-size:42px;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;min-height:52px}
.testReading{font-size:18px;font-weight:600;margin:4px 0 6px}
.testCanvasWrap{position:relative;width:100%;height:150px;background:#fff;border:2px solid #d8d5cf;border-radius:12px;overflow:hidden;touch-action:none}
.testCanvasWrap canvas{position:absolute;inset:0}
.testMyAnswer{font-size:13px;color:#777;margin:4px 0}

.score{text-align:center;font-size:28px;font-weight:700;margin:10px}
.rest{text-align:center;padding:35px 10px;font-size:18px;color:#666}
.small{font-size:13px;color:#777;text-align:center}
@media(max-width:700px){.practice{grid-template-columns:1fr}.testGrid{grid-template-columns:repeat(2,1fr)}.kanji{font-size:96px}}

const START = new Date("2026-08-24T00:00:00");

const $ = id => document.getElementById(id);

const esc = s => String(s).replace(/[&<>"']/g, c => ({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"
}[c]));

function save(key,val){
  localStorage.setItem("kanji_"+key,JSON.stringify(val));
}

function load(key,def){
  try{
    const v=localStorage.getItem("kanji_"+key);
    return v===null ? def : JSON.parse(v);
  }catch(e){
    return def;
  }
}

/* 今日の日付から第何週かを計算 */
const today = new Date();
const midnight = new Date(
  today.getFullYear(),
  today.getMonth(),
  today.getDate()
);

let diff = Math.floor((midnight-START)/86400000);

let weekNo =
  diff < 0
    ? 1
    : Math.min(52,Math.floor(diff/7)+1);

let weekIndex = weekNo-1;

/* その週の5文字 */
function weekItems(){

  if(weekIndex < 40){
    return KANJI.slice(
      weekIndex*5,
      weekIndex*5+5
    );
  }

  const base=((weekIndex-40)*17)%KANJI.length;

  return [0,1,2,3,4].map(i =>
    KANJI[(base+i*7)%KANJI.length]
  );
}

/* 選択状態を解除して、青い文字選択を防ぐ */
document.addEventListener(
  "selectstart",
  e => e.preventDefault()
);

document.addEventListener(
  "selectionchange",
  () => {
    const s=window.getSelection();
    if(s && !s.isCollapsed){
      s.removeAllRanges();
    }
  }
);


/* 曜日ボタン */
const todayDay=today.getDay();

document.querySelectorAll(".day").forEach(button => {

  button.addEventListener("click",e => {

    e.preventDefault();
    e.stopPropagation();

    render(
      Number(button.dataset.d)
    );
  });

});


/* 今日の曜日を選択 */
document.querySelectorAll(".day").forEach(button => {
  button.classList.toggle(
    "active",
    Number(button.dataset.d)===todayDay
  );
});


/* 週表示 */
function updateWeekDisplay(){
  $("week").textContent =
    weekNo<=40
      ? `第${weekNo}週：新しい漢字 5字`
      : `第${weekNo}週：復習週`;
}

/* 週を選んで確認 */
$("weekSelect").value = String(Math.min(40,Math.max(1,weekNo)));

$("weekSelect").addEventListener("change",()=>{
  weekNo = Number($("weekSelect").value);
  weekIndex = weekNo-1;
  updateWeekDisplay();

  /* 選んだ週をすぐ確認できるよう、月曜日を表示 */
  render(1);
});

updateWeekDisplay();

/* 初期表示 */
render(todayDay);


/* =========================
   曜日を押したときの表示
========================= */

function render(d){

  document.querySelectorAll(".day").forEach(button => {

    button.classList.toggle(
      "active",
      Number(button.dataset.d)===d
    );

  });

  const items=weekItems();


  /* 日曜日 */
  if(d===0){

    $("notice").textContent =
      "今日は休みです。前に習った漢字を自由に復習しましょう。";

    $("app").innerHTML=`
      <section class="card">
        <div class="rest">
          🌿 今日はお休み
          <br>
          <span class="small">
            気になる漢字を自由に復習しましょう。
          </span>
        </div>
      </section>
    `;

    return;
  }


  /* 土曜日 */
  if(d===6){

    $("notice").textContent =
      "今日はテストの日です。";

    renderTest(items);

    return;
  }


  /* 月〜金 */
  const item=items[d-1];

  $("notice").textContent =
    `${["日","月","火","水","木","金","土"][d]}曜日：今日の1文字`;

  renderStudy(item,d);
}

/* =========================
   Apple Pencil / iPad
   書く部分
========================= */

function setupCanvas(c){

  const ctx=c.getContext("2d");

  let drawing=false;
  let lastX=0;
  let lastY=0;
  let activePointerId=null;


  function resize(){

    const r=c.getBoundingClientRect();

    const dpr=Math.max(
      1,
      Math.min(
        3,
        window.devicePixelRatio || 1
      )
    );

    c.width=Math.max(
      1,
      Math.round(r.width*dpr)
    );

    c.height=Math.max(
      1,
      Math.round(r.height*dpr)
    );

    ctx.setTransform(
      dpr,
      0,
      0,
      dpr,
      0,
      0
    );

    ctx.lineCap="round";
    ctx.lineJoin="round";
    ctx.lineWidth=5;
    ctx.strokeStyle="#111";
    ctx.fillStyle="#111";
  }


  resize();


  window.addEventListener(
    "resize",
    resize
  );


  function getPoint(e){

    const r=c.getBoundingClientRect();

    return {
      x:Math.max(
        0,
        Math.min(
          r.width,
          e.clientX-r.left
        )
      ),
      y:Math.max(
        0,
        Math.min(
          r.height,
          e.clientY-r.top
        )
      )
    };
  }


  /* Apple Pencil / 指：書き始め */
  function startPointer(e){

    if(
      e.pointerType!=="pen" &&
      e.pointerType!=="touch" &&
      e.pointerType!=="mouse"
    ){
      return;
    }

    e.preventDefault();

    activePointerId=e.pointerId;

    try{
      c.setPointerCapture(e.pointerId);
    }catch(err){}

    const p=getPoint(e);

    drawing=true;
    lastX=p.x;
    lastY=p.y;

    /* 最初のタップも確実に点として反映 */
    ctx.beginPath();
    ctx.arc(
      lastX,
      lastY,
      2.8,
      0,
      Math.PI*2
    );
    ctx.fill();
  }


  /* Apple Pencil / 指：移動 */
  function movePointer(e){

    if(
      !drawing ||
      e.pointerId!==activePointerId
    ){
      return;
    }

    e.preventDefault();

    const p=getPoint(e);

    const dx=p.x-lastX;
    const dy=p.y-lastY;

    if(
      Math.abs(dx)<0.05 &&
      Math.abs(dy)<0.05
    ){
      return;
    }

    ctx.beginPath();
    ctx.moveTo(lastX,lastY);
    ctx.lineTo(p.x,p.y);
    ctx.stroke();

    lastX=p.x;
    lastY=p.y;
  }


  /* Apple Pencil / 指：終了 */
  function endPointer(e){

    if(
      activePointerId!==null &&
      e.pointerId!==activePointerId
    ){
      return;
    }

    e.preventDefault();

    drawing=false;

    try{
      if(c.hasPointerCapture(e.pointerId)){
        c.releasePointerCapture(e.pointerId);
      }
    }catch(err){}

    activePointerId=null;
  }


  /*
    Pointer Eventsを使用
    → iPad Safari / Apple Pencilで安定して入力
    → 指でも書ける
    → 線が途中で切れにくい
  */
  c.addEventListener(
    "pointerdown",
    startPointer,
    {passive:false}
  );

  c.addEventListener(
    "pointermove",
    movePointer,
    {passive:false}
  );

  c.addEventListener(
    "pointerup",
    endPointer,
    {passive:false}
  );

  c.addEventListener(
    "pointercancel",
    endPointer,
    {passive:false}
  );

  c.addEventListener(
    "pointerleave",
    e => {
      if(drawing && e.pointerType==="mouse"){
        endPointer(e);
      }
    },
    {passive:false}
  );
}


/* =========================
   消す
========================= */

function clearCanvas(c){

  const ctx=c.getContext("2d");

  ctx.clearRect(
    0,
    0,
    c.width,
    c.height
  );


  const dpr=Math.max(
    1,
    Math.min(
      3,
      window.devicePixelRatio || 1
    )
  );


  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );

}


/* =========================
   土曜日テスト
========================= */

function renderTest(items){

  const state=load(
    "test_"+weekNo,
    [false,false,false,false,false]
  );

  $("app").innerHTML=`
    <section class="card">
      <div class="testTitle">⭐ 土曜日の5文字テスト</div>
      <div class="small">
        ふりがなを見て、空らんに漢字を書こう。<br>
        書き終わったら「答え」で答え合わせをしよう。
      </div>

      <div class="testGrid">
        ${items.map((it,i)=>`
          <div class="testItem">
            <div class="q">第${i+1}問</div>
            <div class="testReading">${esc(it.r.split("・")[0])}</div>
            <div class="testCanvasWrap">
              <canvas id="testCanvas${i}"></canvas>
            </div>
            <div class="testMyAnswer">自分で書いた答え</div>
            <div class="answer" id="ans${i}">？</div>
            <button data-answer="${i}">答え</button>
            <button class="secondary" data-done="${i}">
              ${state[i] ? "✓ できた" : "○ できた"}
            </button>
          </div>
        `).join("")}
      </div>

      <div class="score" id="score">${state.filter(Boolean).length} / 5</div>

      <div class="actions">
        <button id="showAll">答えを見る</button>
        <button class="secondary" id="resetTest">テストをやり直す</button>
      </div>
    </section>
  `;

  items.forEach((it,i)=>{
    setupCanvas($("testCanvas"+i));
  });

  document.querySelectorAll("[data-answer]").forEach(button=>{
    button.onclick=()=>{
      const i=Number(button.dataset.answer);
      $("ans"+i).textContent=items[i].k;
    };
  });

  document.querySelectorAll("[data-done]").forEach(button=>{
    button.onclick=()=>{
      const i=Number(button.dataset.done);
      state[i]=!state[i];
      save("test_"+weekNo,state);
      button.textContent=state[i] ? "✓ できた" : "○ できた";
      $("score").textContent=state.filter(Boolean).length+" / 5";
    };
  });

  $("showAll").onclick=()=>{
    items.forEach((it,i)=>{
      $("ans"+i).textContent=it.k;
    });
  };

  $("resetTest").onclick=()=>{
    save("test_"+weekNo,[false,false,false,false,false]);
    renderTest(items);
  };
}
