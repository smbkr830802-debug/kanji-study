<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f7f4ee">
<title>小3 漢字れんしゅう</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;min-height:100%;background:#f7f4ee;color:#292929;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
body{padding-bottom:30px} main{max-width:1100px;margin:auto;padding:16px}
h1{text-align:center;font-size:25px;margin:8px 0 16px}
.card{background:#fff;border-radius:20px;padding:16px;margin-top:14px;box-shadow:0 2px 12px rgba(0,0,0,.04)}
.weekbar{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.weekbtn,.daybtn{border:0;border-radius:14px;background:#eeeae4;color:#333;padding:10px 12px;font-size:14px;min-width:78px}
.weekbtn.active,.daybtn.active{background:#5e7967;color:#fff}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.daybtn{min-width:0}.status{text-align:center;color:#777;margin:10px 0 0}
.kcard{text-align:center}.kbig{font:120px "Hiragino Mincho ProN","Yu Mincho",serif;line-height:1.1;margin:4px}
.reading{font-size:18px;color:#666;margin-bottom:12px}
.panels{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.panel{border:2px solid #ddd;border-radius:18px;padding:12px}.panel h2{font-size:18px;margin:0 0 10px}
.canvaswrap{position:relative;width:100%;height:min(62vw,430px);min-height:280px}
canvas{position:absolute;inset:0;width:100%;height:100%;background:#fff;border:2px solid #ccc;border-radius:16px;display:block;-webkit-user-drag:none;user-drag:none;-webkit-tap-highlight-color:transparent;touch-action:none}
.trace{opacity:.16;pointer-events:none}
.buttons{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:10px}
button.action{font-size:16px;padding:11px 18px;border:0;border-radius:14px;background:#5e7967;color:#fff}
button.secondary{background:#e9e6de;color:#222}
.testgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.testitem{border:1px solid #ddd;border-radius:14px;padding:10px;text-align:center;min-height:150px}
.testq{font-size:15px;color:#555}.testanswer{font:48px "Hiragino Mincho ProN","Yu Mincho",serif;margin:10px}
.done{background:#e9e6de;color:#222;border:0;border-radius:12px;padding:8px 12px}
.score{font-size:28px;font-weight:700;text-align:center;margin:8px}.note{text-align:center;color:#777;font-size:14px}
@media(max-width:700px){.panels{grid-template-columns:1fr}.testgrid{grid-template-columns:repeat(2,1fr)}.kbig{font-size:100px}}
</style>
</head>
<body>
<main>
<h1>📚 小3 漢字れんしゅう</h1>
<div class="card">
  <div class="weekbar" id="weeks"></div>
  <div class="days" id="days"></div>
  <div class="status" id="status"></div>
</div>
<div id="content"></div>
</main>
<script>
const WEEKS=[["詩", "葉", "習", "着", "登"], ["物", "持", "旅", "始", "進"], ["動", "深", "様", "面", "館"], ["号", "調", "使", "問", "意"], ["悪", "安", "暗", "医", "委"], ["育", "員", "院", "飲", "運"], ["泳", "駅", "央", "横", "屋"], ["温", "化", "荷", "界", "開"], ["階", "寒", "感", "漢", "岸"], ["起", "期", "客", "究", "急"], ["級", "宮", "球", "去", "橋"], ["業", "曲", "局", "銀", "区"], ["苦", "具", "君", "係", "軽"], ["血", "決", "研", "県", "庫"], ["湖", "向", "幸", "港", "根"], ["祭", "皿", "仕", "死", "指"], ["歯", "次", "事", "式", "実"], ["写", "者", "主", "守", "取"], ["酒", "受", "州", "拾", "終"], ["集", "住", "重", "宿", "所"], ["暑", "助", "昭", "消", "商"], ["章", "勝", "乗", "植", "申"], ["身", "神", "真", "世", "整"], ["昔", "全", "相", "送", "想"], ["息", "速", "族", "他", "打"], ["対", "待", "代", "第", "題"], ["炭", "短", "談", "注", "柱"], ["丁", "帳", "追", "定", "庭"], ["笛", "鉄", "転", "都", "度"], ["投", "豆", "島", "湯", "等"], ["童", "農", "波", "配", "倍"], ["箱", "畑", "発", "反", "坂"], ["板", "皮", "悲", "美", "鼻"], ["筆", "氷", "表", "秒", "病"], ["品", "負", "部", "服", "福"], ["平", "返", "勉", "放", "味"], ["命", "役", "薬", "由", "油"], ["有", "遊", "予", "羊", "洋"], ["陽", "落", "流", "両", "緑"], ["礼", "列", "練", "路", "和"]];
const DATA=[{"kanji": "悪", "reading": "わるい"}, {"kanji": "安", "reading": "やすい"}, {"kanji": "暗", "reading": "くらい"}, {"kanji": "医", "reading": "い"}, {"kanji": "委", "reading": "い"}, {"kanji": "意", "reading": "い"}, {"kanji": "育", "reading": "そだつ"}, {"kanji": "員", "reading": "いん"}, {"kanji": "院", "reading": "いん"}, {"kanji": "飲", "reading": "のむ"}, {"kanji": "運", "reading": "うん"}, {"kanji": "泳", "reading": "およぐ"}, {"kanji": "駅", "reading": "えき"}, {"kanji": "央", "reading": "おう"}, {"kanji": "横", "reading": "よこ"}, {"kanji": "屋", "reading": "や"}, {"kanji": "温", "reading": "あたたかい"}, {"kanji": "化", "reading": "か"}, {"kanji": "荷", "reading": "に"}, {"kanji": "界", "reading": "かい"}, {"kanji": "開", "reading": "ひらく"}, {"kanji": "階", "reading": "かい"}, {"kanji": "寒", "reading": "さむい"}, {"kanji": "感", "reading": "かん"}, {"kanji": "漢", "reading": "かん"}, {"kanji": "館", "reading": "かん"}, {"kanji": "岸", "reading": "きし"}, {"kanji": "起", "reading": "おきる"}, {"kanji": "期", "reading": "き"}, {"kanji": "客", "reading": "きゃく"}, {"kanji": "究", "reading": "きわめる"}, {"kanji": "急", "reading": "いそぐ"}, {"kanji": "級", "reading": "きゅう"}, {"kanji": "宮", "reading": "みや"}, {"kanji": "球", "reading": "きゅう"}, {"kanji": "去", "reading": "さる"}, {"kanji": "橋", "reading": "はし"}, {"kanji": "業", "reading": "ぎょう"}, {"kanji": "曲", "reading": "まがる"}, {"kanji": "局", "reading": "きょく"}, {"kanji": "銀", "reading": "ぎん"}, {"kanji": "区", "reading": "く"}, {"kanji": "苦", "reading": "くるしい"}, {"kanji": "具", "reading": "ぐ"}, {"kanji": "君", "reading": "きみ"}, {"kanji": "係", "reading": "かかり"}, {"kanji": "軽", "reading": "かるい"}, {"kanji": "血", "reading": "ち"}, {"kanji": "決", "reading": "きめる"}, {"kanji": "研", "reading": "けん"}, {"kanji": "県", "reading": "けん"}, {"kanji": "庫", "reading": "こ"}, {"kanji": "湖", "reading": "みずうみ"}, {"kanji": "向", "reading": "むく"}, {"kanji": "幸", "reading": "しあわせ"}, {"kanji": "港", "reading": "みなと"}, {"kanji": "号", "reading": "ごう"}, {"kanji": "根", "reading": "ね"}, {"kanji": "祭", "reading": "まつり"}, {"kanji": "皿", "reading": "さら"}, {"kanji": "仕", "reading": "し"}, {"kanji": "死", "reading": "しぬ"}, {"kanji": "使", "reading": "つかう"}, {"kanji": "始", "reading": "はじめる"}, {"kanji": "指", "reading": "ゆび"}, {"kanji": "歯", "reading": "は"}, {"kanji": "詩", "reading": "し"}, {"kanji": "次", "reading": "つぎ"}, {"kanji": "事", "reading": "こと"}, {"kanji": "持", "reading": "もつ"}, {"kanji": "式", "reading": "しき"}, {"kanji": "実", "reading": "み"}, {"kanji": "写", "reading": "うつす"}, {"kanji": "者", "reading": "もの"}, {"kanji": "主", "reading": "ぬし"}, {"kanji": "守", "reading": "まもる"}, {"kanji": "取", "reading": "とる"}, {"kanji": "酒", "reading": "さけ"}, {"kanji": "受", "reading": "うける"}, {"kanji": "州", "reading": "しゅう"}, {"kanji": "拾", "reading": "ひろう"}, {"kanji": "終", "reading": "おわる"}, {"kanji": "習", "reading": "ならう"}, {"kanji": "集", "reading": "あつまる"}, {"kanji": "住", "reading": "すむ"}, {"kanji": "重", "reading": "おもい"}, {"kanji": "宿", "reading": "やど"}, {"kanji": "所", "reading": "ところ"}, {"kanji": "暑", "reading": "あつい"}, {"kanji": "助", "reading": "たすける"}, {"kanji": "昭", "reading": "しょう"}, {"kanji": "消", "reading": "きえる"}, {"kanji": "商", "reading": "しょう"}, {"kanji": "章", "reading": "しょう"}, {"kanji": "勝", "reading": "かつ"}, {"kanji": "乗", "reading": "のる"}, {"kanji": "植", "reading": "うえる"}, {"kanji": "申", "reading": "もうす"}, {"kanji": "身", "reading": "み"}, {"kanji": "神", "reading": "かみ"}, {"kanji": "真", "reading": "まこと"}, {"kanji": "深", "reading": "ふかい"}, {"kanji": "進", "reading": "すすむ"}, {"kanji": "世", "reading": "よ"}, {"kanji": "整", "reading": "ととのえる"}, {"kanji": "昔", "reading": "むかし"}, {"kanji": "全", "reading": "ぜん"}, {"kanji": "相", "reading": "あい"}, {"kanji": "送", "reading": "おくる"}, {"kanji": "想", "reading": "そう"}, {"kanji": "息", "reading": "いき"}, {"kanji": "速", "reading": "はやい"}, {"kanji": "族", "reading": "ぞく"}, {"kanji": "他", "reading": "ほか"}, {"kanji": "打", "reading": "うつ"}, {"kanji": "対", "reading": "たい"}, {"kanji": "待", "reading": "まつ"}, {"kanji": "代", "reading": "だい"}, {"kanji": "第", "reading": "だい"}, {"kanji": "題", "reading": "だい"}, {"kanji": "炭", "reading": "すみ"}, {"kanji": "短", "reading": "みじかい"}, {"kanji": "談", "reading": "だん"}, {"kanji": "着", "reading": "きる"}, {"kanji": "注", "reading": "ちゅう"}, {"kanji": "柱", "reading": "はしら"}, {"kanji": "丁", "reading": "ちょう"}, {"kanji": "帳", "reading": "ちょう"}, {"kanji": "調", "reading": "しらべる"}, {"kanji": "追", "reading": "おう"}, {"kanji": "定", "reading": "さだめる"}, {"kanji": "庭", "reading": "にわ"}, {"kanji": "笛", "reading": "ふえ"}, {"kanji": "鉄", "reading": "てつ"}, {"kanji": "転", "reading": "ころぶ"}, {"kanji": "都", "reading": "と"}, {"kanji": "度", "reading": "たび"}, {"kanji": "投", "reading": "なげる"}, {"kanji": "豆", "reading": "まめ"}, {"kanji": "島", "reading": "しま"}, {"kanji": "湯", "reading": "ゆ"}, {"kanji": "登", "reading": "のぼる"}, {"kanji": "等", "reading": "ひとしい"}, {"kanji": "動", "reading": "うごく"}, {"kanji": "童", "reading": "どう"}, {"kanji": "農", "reading": "のう"}, {"kanji": "波", "reading": "なみ"}, {"kanji": "配", "reading": "くばる"}, {"kanji": "倍", "reading": "ばい"}, {"kanji": "箱", "reading": "はこ"}, {"kanji": "畑", "reading": "はたけ"}, {"kanji": "発", "reading": "はつ"}, {"kanji": "反", "reading": "はん"}, {"kanji": "坂", "reading": "さか"}, {"kanji": "板", "reading": "いた"}, {"kanji": "皮", "reading": "かわ"}, {"kanji": "悲", "reading": "かなしい"}, {"kanji": "美", "reading": "うつくしい"}, {"kanji": "鼻", "reading": "はな"}, {"kanji": "筆", "reading": "ふで"}, {"kanji": "氷", "reading": "こおり"}, {"kanji": "表", "reading": "おもて"}, {"kanji": "秒", "reading": "びょう"}, {"kanji": "病", "reading": "びょう"}, {"kanji": "品", "reading": "しな"}, {"kanji": "負", "reading": "まける"}, {"kanji": "部", "reading": "ぶ"}, {"kanji": "服", "reading": "ふく"}, {"kanji": "福", "reading": "ふく"}, {"kanji": "物", "reading": "もの"}, {"kanji": "平", "reading": "たいら"}, {"kanji": "返", "reading": "かえす"}, {"kanji": "勉", "reading": "べん"}, {"kanji": "放", "reading": "はなす"}, {"kanji": "味", "reading": "あじ"}, {"kanji": "命", "reading": "いのち"}, {"kanji": "面", "reading": "おもて"}, {"kanji": "問", "reading": "とう"}, {"kanji": "役", "reading": "やく"}, {"kanji": "薬", "reading": "くすり"}, {"kanji": "由", "reading": "ゆう"}, {"kanji": "油", "reading": "あぶら"}, {"kanji": "有", "reading": "ある"}, {"kanji": "遊", "reading": "あそぶ"}, {"kanji": "予", "reading": "よ"}, {"kanji": "羊", "reading": "ひつじ"}, {"kanji": "洋", "reading": "よう"}, {"kanji": "葉", "reading": "は"}, {"kanji": "陽", "reading": "ひ"}, {"kanji": "様", "reading": "よう"}, {"kanji": "落", "reading": "おちる"}, {"kanji": "流", "reading": "ながれる"}, {"kanji": "旅", "reading": "たび"}, {"kanji": "両", "reading": "りょう"}, {"kanji": "緑", "reading": "みどり"}, {"kanji": "礼", "reading": "れい"}, {"kanji": "列", "reading": "れつ"}, {"kanji": "練", "reading": "ねる"}, {"kanji": "路", "reading": "みち"}, {"kanji": "和", "reading": "わ"}];
const INFO=Object.fromEntries(DATA.map(x=>[x.kanji,x]));
let week=Number(localStorage.getItem("kanjiWeek")||0);
let day=Number(localStorage.getItem("kanjiDay")||0);
let done=JSON.parse(localStorage.getItem("kanjiDone")||"{}");
function save(){localStorage.setItem("kanjiWeek",week);localStorage.setItem("kanjiDay",day);localStorage.setItem("kanjiDone",JSON.stringify(done));}
function renderNav(){
 const wb=document.getElementById("weeks");wb.innerHTML="";
 WEEKS.forEach((w,i)=>{const b=document.createElement("button");b.className="weekbtn"+(i===week?" active":"");b.textContent=`第${i+1}週`;b.onclick=()=>{week=i;day=0;save();render()};wb.appendChild(b)});
 const db=document.getElementById("days");db.innerHTML="";
 ["月","火","水","木","金","土","日"].forEach((d,i)=>{const b=document.createElement("button");b.className="daybtn"+(i===day?" active":"");b.textContent=d+(i<5?" 習":" "+(i===5?"テスト":"休み"));b.onclick=()=>{day=i;save();render()};db.appendChild(b)});
}
function canvasDraw(canvas){
 const ctx=canvas.getContext("2d");let drawing=false,last=null;
 function pos(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}}
 canvas.width=900;canvas.height=520;ctx.lineWidth=9;ctx.lineCap="round";ctx.lineJoin="round";
 canvas.addEventListener("pointerdown",e=>{drawing=true;last=pos(e);canvas.setPointerCapture(e.pointerId)});
 canvas.addEventListener("pointermove",e=>{if(!drawing)return;const p=pos(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p});
 ["pointerup","pointercancel","pointerleave"].forEach(t=>canvas.addEventListener(t,()=>drawing=false));
 return ()=>ctx.clearRect(0,0,canvas.width,canvas.height);
}
function study(k){
 const info=INFO[k]||{reading:""};
 document.getElementById("status").textContent=`第${week+1}週・${["月","火","水","木","金"][day]}曜日`;
 const c=document.getElementById("content");
 c.innerHTML=`<div class="card kcard"><div class="kbig">${k}</div><div class="reading">${info.reading}</div>
 <div class="panels">
 <div class="panel"><h2>① なぞり書き</h2><div class="canvaswrap"><canvas id="trace" class="trace"></canvas><canvas id="traceDraw"></canvas></div><div class="buttons"><button class="action secondary" id="clearTrace">消す</button></div></div>
 <div class="panel"><h2>② 自分で書こう</h2><div class="canvaswrap"><canvas id="write"></canvas></div><div class="buttons"><button class="action secondary" id="clearWrite">消す</button><button class="action" id="doneBtn">できた！</button></div></div>
 </div></div>`;
 const t=document.getElementById("trace"),td=document.getElementById("traceDraw"),w=document.getElementById("write");
 [t,td,w].forEach(x=>{x.width=900;x.height=520});
 const tc=t.getContext("2d");tc.font='360px "Hiragino Mincho ProN","Yu Mincho",serif';tc.textAlign="center";tc.textBaseline="middle";tc.fillText(k,450,265);
 const clearT=canvasDraw(td),clearW=canvasDraw(w);
 document.getElementById("clearTrace").onclick=clearT;document.getElementById("clearWrite").onclick=clearW;
 document.getElementById("doneBtn").onclick=()=>{done[`${week}-${day}`]=true;save();document.getElementById("doneBtn").textContent="できた！✓"};
}
function test(){
 document.getElementById("status").textContent=`第${week+1}週・土曜日の5文字テスト`;
 const arr=WEEKS[week],c=document.getElementById("content");
 c.innerHTML=`<div class="card"><h2 style="text-align:center">⭐ 第${week+1}週の5文字テスト</h2><p class="note">漢字を見ないで書いてから、「答え」を押して答え合わせをしよう。</p>
 <div class="testgrid">${arr.map((k,i)=>`<div class="testitem"><div>第${i+1}問</div><div class="testq">読み：${INFO[k]?.reading||""}</div><div class="testanswer" id="a${i}">？</div><button class="action secondary" onclick="showAns(${i},'${k}')">答え</button><br><button class="done" onclick="markTest(${i})">○ できた</button></div>`).join("")}</div>
 <div class="score" id="score">0 / 5</div><div class="buttons"><button class="action" onclick="showAll()">答えを全部見る</button><button class="action secondary" onclick="render()">テストをやり直す</button></div></div>`;
}
function showAns(i,k){document.getElementById("a"+i).textContent=k}
function showAll(){WEEKS[week].forEach((k,i)=>showAns(i,k))}
function markTest(i){const key=`test-${week}-${i}`;done[key]=true;save();const n=WEEKS[week].filter((_,j)=>done[`test-${week}-${j}`]).length;document.getElementById("score").textContent=`${n} / 5`}
function rest(){document.getElementById("status").textContent=`第${week+1}週・日曜日`;document.getElementById("content").innerHTML=`<div class="card note"><h2>🌿 今日はお休み</h2><p>昨日のテストでまちがえた漢字を、少しだけ復習してもOKです。</p></div>`}
function render(){renderNav();if(day<5)study(WEEKS[week][day]);else if(day===5)test();else rest()}
render();
</script>
</body>
</html>
